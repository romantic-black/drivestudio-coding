# Minimal StreetForward Stage 4.1 — 单段在线训练（MultiSceneDataset，无 overfit .pt）
#
# 用法（示例）:
#   conda run -n drivestudio-new env PYTHONPATH=/root/drivestudio-coding \
#   python tools/train_minimal_streetforward_stage4_1_one_segment.py \
#     --config_file configs/minimal_streetforward_stage4_1_one_segment.yaml
#
# 必填: 按本地数据修改 data.data_root；one_segment.scene_id / segment_id；
#       data.train_scene_ids 必须包含 scene_id。

output_name: minimal_sf_stage4_1_one_segment

# 基础数据配置（与 configs/overfit_one_batch_template.yaml 对齐，可按本地数据替换）
data:
  data_root: "/root/autodl-tmp/nuScenes/"
  dataset: "nuscenes"
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  sky_mask_semantics: one_is_sky
  train_scene_ids: [1]
  eval_scene_ids: []

  pixel_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2]
    downscale_when_loading: [3, 3, 3]
    downscale: 1
    undistort: False
    test_image_stride: 0
    max_test_images: 4
    load_sky_mask: true
    load_dynamic_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3

  lidar_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 4
    lidar_percentile: 0.02

# MultiSceneDataset（每步 get_segment_batch 会重新随机关键帧与帧内采样；实现侧会将 num_source_keyframes 置为 1）
dataset:
  num_source_keyframes: 1
  num_target_keyframes: 3
  segment_overlap_ratio: 0.2

  # 调小场景和段的 keyframes 最小要求，防止短片段被内部策略过滤
  min_keyframes_per_scene: 2
  min_keyframes_per_segment: 2

  segment_aabb:
    - [-40.0, -20.0, -20.0]
    - [40.0, 4.8, 70.0]

  pointcloud:
    type: "hybrid"
    lidar_sparsity: full
    monocular_chosen_cam_ids: [0, 1, 2]
    monocular_sparsity: full
    monocular_filter_sky: true
    monocular_depth_consistency: false
    monocular_downscale: 2
    monocular_dynamic_filter: true
    monocular_dynamic_mask_key: dynamic_masks  # dynamic_masks | human_masks | vehicle_masks
    near_max_points: 400000
    distant_max_points: 400000
    fusion_strategy: merge
    dynamic_source: lidar_only
    downsample_dynamic: false
    background_downsample_method: uniform

# 单段训练目标（fast-fail：缺键则报错）
one_segment:
  scene_id: 1
  segment_id: 0
  include_test: true

# 以下为 Stage 4.1 模型与训练（与 minimal_streetforward_stage4_1.yaml 对齐；不使用 explicit view_selection）
model:
  scale_init_value: 0.1
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  update_node_state_interval: 1
  reset_node_state_interval: 10
  sky:
    resolution: 1024
    init_value: 0.5

  branches:
    bg:
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.30
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.1
      limits:
        offset_max: 0.1
        scale_max: 0.1
        omega_max: 0.1
        opacity_max: 0.1
        sh_dc_max: 0.1
        sh_rest_max: 0.05
      eta:
        means: 1.0
        scales: 1.0
        opacity: 1.0
        sh_dc: 1.0
        sh_rest: 1.0
      mlp:
        hidden_dim: 64
        use_3d_feat: true
        use_2d_feat: true
        freeze_quat: false

    distant:
      freeze_means: true
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -1.90
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.05
      limits:
        offset_max: 0.02
        scale_max: 0.08
        omega_max: 0.01
        opacity_max: 0.05
        sh_dc_max: 0.08
        sh_rest_max: 0.015
      eta:
        means: 0.2
        scales: 0.7
        opacity: 0.5
        sh_dc: 0.8
        sh_rest: 0.4
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: true

    rigid:
      src_backproject_support_min: 1.0e-6
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.10
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.10
      limits:
        offset_max: 0.05
        scale_max: 0.08
        omega_max: 0.05
        opacity_max: 0.08
        sh_dc_max: 0.08
        sh_rest_max: 0.03
      eta:
        means: 0.5
        scales: 0.8
        opacity: 0.8
        sh_dc: 0.8
        sh_rest: 0.5
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: false

losses:
  rgb:
    w: 0.8
  ssim:
    w: 0.2
  mask:
    w: 0.05
    opacity_loss_type: bce
  opacity_entropy:
    w: 0.0

optimizer:
  lr: 1.0e-3
  eps: 1.0e-15
  weight_decay: 0.0

training:
  max_iterations: 4000
  log_interval: 50
  save_checkpoint_freq: 500
  seed: 42

eval:
  enable_psnr: true
  metric_interval: 10
  heavy_metric_interval: 50
  run_test_at_end: true

logging:
  image_interval: 500
  enable_jsonl_metrics: true
  use_tensorboard: true
  diagnostics:
    enable: true
    interval: 200
    window_size: 50
    save_branch_renders: true
  performance:
    enable: true
    phase_timing: true
    cuda_memory: true
