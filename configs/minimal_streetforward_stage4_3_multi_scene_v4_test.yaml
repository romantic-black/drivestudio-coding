# =============================================================================
# Stage4.3 多场景 V4 — 正式测试配置模板
# 入口：PYTHONPATH=/root/drivestudio-coding python tools/test_minimal_streetforward_stage4_3.py \
#   --config_file configs/minimal_streetforward_stage4_3_multi_scene_v4_test.yaml \
#   --init_checkpoint <path/to/checkpoint.pt> [--init_weights_only]
#
# 说明：
# - data.eval_scene_ids：仅列出「能成功经 MultiSceneDataset 加载」的场景 ID。
#   加载失败常见原因见文件末尾「故障排查」。
# - data.train_scene_ids: []：eval-only 时允许为空；test runner 会处理 initialize()。
# - dataset.min_keyframes_per_scene：场景级门槛；某 scene 在 train split + keyframe 切分后
#   keyframe 段数 < 该值时，整场景会被跳过（日志：insufficient keyframes）。
# =============================================================================
output_name: minimal_sf_stage4_3_multi_scene_v4_test

data:
  # 需与本机 nuScenes 预处理路径一致；不对则所有 scene 都会加载失败。
  data_root: "/root/autodl-tmp/nuScenes/"
  dataset: "nuscenes"
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  sky_mask_semantics: one_is_sky
  # 测试 runner 仅消费 eval_scene_ids；train_scene_ids 不参与 hold-out 语义统计。
  train_scene_ids: []
  # 正式 eval 场景 ID；必须存在于数据集中，且满足 _is_scene_suitable（keyframe 数 >= min_keyframes_per_scene）。
  # 若某 ID 在日志里被标为「insufficient keyframes」，请换 scene 或检查下述 dataset 门槛。
  eval_scene_ids: [1]
  preload:
    # 预加载子系统：用于降低 I/O 抖动与跨阶段等待。
    # 单机测试推荐先保持 1 worker，先验证语义正确，再加并发。
    enable: true
    num_workers: 1
    max_pending_tasks: 64
    enable_view_pack_cache: true
    view_cache_max_items_total: 32
    view_cache_max_items_per_scene: 16
    view_cache_device: cpu
    drop_stale_hints: true
    dedupe_tasks: true
    warm_segment_static: true
    warm_segment_pointcloud: true
    warm_next_block_exact: true
    warm_test_refs: true
    warm_episode_source_superset: true
    warm_overlap_pairs_episode_superset: true
    warm_overlap_pairs_next_block_exact: true
    stats_log_interval_steps: 0
  pixel_source:
    # 像素数据源：决定相机集合、图像缩放与 train/test 帧切分语义。
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2, 3, 4, 5]
    downscale_when_loading: [3, 3, 3, 3, 3, 3]
    downscale: 1
    undistort: False
    # 0: 所有 frame 同时用于训练与测试（train=test 全帧自评估模式）。
    # >0: 先按 stride 抽取 test frames，剩余 frames 作为 train；
    #     keyframe / segment 仅基于 train frames 构建。
    test_image_stride: 0
    # 0: 不截断，测试时评估该 segment 的全部 test frames（exhaustive）。
    # 本修订方案固定使用 0，max_test_images > 0 会触发 fast-fail。
    max_test_images: 0
    load_sky_mask: true
    load_dynamic_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    # 激光数据源：用于点云构建与自动 AABB。
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 1
    lidar_percentile: 0.02

dataset:
  # keyframe/segment 的 canonical 语义：
  # - stride>0: 仅在 train_frame_indices 上构建 keyframe/segment；
  # - stride=0: train/test 同为全帧，此时 keyframe 实际在全帧上构建。
  num_source_keyframes: 1
  num_target_keyframes: 3
  segment_overlap_ratio: 0.2
  # 场景是否可用的硬门槛：split_trajectory 在「train 帧子集」上得到的段数 >= 此值。
  # 与整场景总帧数无关；test_image_stride=1 时常只剩 1 个 train 帧 → 段数恒为 1。
  min_keyframes_per_scene: 2
  min_keyframes_per_segment: 2
  preload_scene_count: 2
  keyframe_split_config:
    num_splits: 0
    min_count: 1
    min_length: 2.0
  segment_aabb:
    - [-40.0, -20.0, -20.0]
    - [40.0, 4.8, 60.0]
  pointcloud:
    type: "hybrid"
    lidar_sparsity: full
    monocular_chosen_cam_ids: [0, 1, 2, 3, 4, 5]
    monocular_sparsity: full
    monocular_filter_sky: true
    monocular_depth_consistency: false
    monocular_downscale: 2
    monocular_dynamic_recovery_bbox_expand_xyz_m: [0.5, 0.2, 0.5]
    monocular_dynamic_recovery_max_points_per_instance: 20000
    near_max_points: 400000
    distant_max_points: 800000
    static_instance_motion:
      enable: true
      traj_length_thresh_m: 0.5

multi_scene:
  # formal test runner 下固定 false，避免训练 batch 混入 test 视角。
  include_test: false

scheduler_v3:
  enable: false
  model_node_state:
    sync_with_scheduler: true

scheduler_v4:
  # 训练侧调度器（adapt_supervised 会使用）；inference_only 不消费该调度器的 next_batch。
  enable: true
  time_base:
    state_write_interval_steps: 1
  source_block:
    updates_per_block: 24
  reset_episode:
    keyframes_per_episode: 12
    episodes_per_segment: 1
    keyframe_window_policy: random_contiguous_window
    pair_order_policy: shuffle_without_replacement
  target_sampling:
    total_target_images: 3
    include_source: true
    extra_target_policy: same_cam_different_keyframe
    prefer_nearby_keyframes: true
    fallback_expand_to_segment: true
    fallback_with_replacement: true
    temporal_neighbor_pool: ring
    temporal_neighbor_max_ring: 2
    temporal_neighbor_cams: [0, 1, 2, 3, 4, 5]
  overlap:
    mode: pointcloud_topk
    stats_log_interval_steps: 0
    point_sample_size: 32768
    candidate_frame_policy: middle
    score_type: nab_over_na
    overlap_min: 0.7
  preload:
    emit_hints: true
    execute_hints: true
  traversal:
    fixed_scene_id: null
    fixed_segment_id: null

model:
  # 模型结构参数：保持与 Stage4.3 训练配置一致，避免测试形态与训练形态漂移。
  scale_init_value: 0.1
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  use_fused_cuda_backproject_v2: true
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  update_node_state_interval: 1
  reset_node_state_interval: 10
  sky:
    resolution: 600
    radius: 75.0
    center: [0.0, 0.0, 0.0]
    hemisphere: true
    hemisphere_up: [0.0, -1.0, 0.0]
  branches:
    bg:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.30
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.1
      limits:
        offset_max: 0.1
        scale_max: 0.1
        omega_max: 0.1
        opacity_max: 0.1
        sh_dc_max: 0.1
        sh_rest_max: 0.05
      eta:
        means: 1.0
        scales: 1.0
        opacity: 1.0
        sh_dc: 1.0
        sh_rest: 1.0
      mlp:
        hidden_dim: 64
        use_3d_feat: true
        use_2d_feat: true
        freeze_quat: false
    distant:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: true
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -1.90
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.05
      limits:
        offset_max: 0.02
        scale_max: 0.08
        omega_max: 0.01
        opacity_max: 0.05
        sh_dc_max: 0.08
        sh_rest_max: 0.015
      eta:
        means: 0.2
        scales: 0.7
        opacity: 0.5
        sh_dc: 0.8
        sh_rest: 0.4
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: true
    sky:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: true
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -0.50
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.05
      limits:
        offset_max: 0.02
        scale_max: 0.08
        omega_max: 0.01
        opacity_max: 0.05
        sh_dc_max: 0.08
        sh_rest_max: 0.015
      eta:
        means: 0.2
        scales: 0.7
        opacity: 0.5
        sh_dc: 0.8
        sh_rest: 0.4
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: true
    rigid:
      src_backproject_support_min: 1e-6
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.10
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.10
      limits:
        offset_max: 0.05
        scale_max: 0.08
        omega_max: 0.05
        opacity_max: 0.08
        sh_dc_max: 0.08
        sh_rest_max: 0.03
      eta:
        means: 0.5
        scales: 0.8
        opacity: 0.8
        sh_dc: 0.8
        sh_rest: 0.5
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: false

losses:
  # adapt_supervised 训练阶段损失。
  rgb: {w: 1.0}
  ssim: {w: 0.05}
  mask:
    w: 0.02
    opacity_loss_type: bce
  opacity_entropy: {w: 0.0}

optimizer:
  # adapt_supervised 训练阶段优化器。
  lr: 1.0e-4
  eps: 1.0e-15
  weight_decay: 0.0

training:
  # 仅供模型与通用工具读取；formal test runner 自身不依赖 max_iterations 主循环。
  max_iterations: 10000000
  log_interval: 100
  save_checkpoint_freq: 20000
  seed: 42

eval:
  # 与旧训练脚本兼容的评估配置；正式测试请以 test: 区块为准。
  enable_psnr: true
  save_train_views_psnr_below: 14
  run_test_at_end: false

test:
  # 正式测试主入口配置。
  enable: true
  # mode:
  # - adapt_supervised: 先监督适配，再按 test refs 评估；
  # - inference_only: 仅构建 scene_state + test refs 渲染评估；
  # - both: 先 adapt_supervised，再 inference_only（可选重载 checkpoint）。
  mode: inference_only
  runner:
    fixed_scene_id: null
    fixed_segment_id: null
    deterministic: true
    seed: 123
    source_protocol: middle_keyframe_middle_frame_cam0
    # 0 表示不限制 segment 数；>0 表示每个 scene 最多评估多少个 segment。
    max_segments_per_scene: 0
    # segment 级最小 test 视角数门槛（逐相机 refs 计数）。
    min_test_views_per_segment: 50
  split:
    # true: data.eval_scene_ids 必须非空。
    require_eval_scene_ids: true
    # true: 强制 max_test_images=0，确保评估 refs 不裁剪（exhaustive）。
    require_exhaustive_test_refs: true
    # true: 任何 eval segment 的 test_frame_indices 为空都 fast-fail。
    require_nonempty_test_views: true
    # true: 允许 stride=0 时 train/test 全重合（train=test 全帧自评估）。
    allow_train_test_overlap_when_stride_zero: true
  adapt_supervised:
    enable: false
    max_steps_per_segment: 2000
    validate_every_blocks: 1
    early_stop_patience: 8
    keep_best_by: psnr
    reset_runtime_state_each_segment: true
  inference_only:
    enable: true
    # inference_only 新语义：train scheduler 推进；每个 episode_end 在 test refs 上评估。
    eval_trigger: episode_end
    # segment 最终指标为各 episode 指标的均值。
    aggregate_across_episodes: mean
    # 0: 不截断，使用 scheduler_v4.reset_episode.episodes_per_segment 完整配额。
    # >0: 仅统计前 N 个 episode。
    max_episodes_per_segment: 0
    # 输出每个 episode 的 summary 指标。
    save_per_episode_metrics_json: true
    # 输出每个 episode 的逐视角指标（文件较大）。
    save_per_episode_per_view_metrics_json: true
    # false: 不把 forward 的 hidden 写回缓存，保证纯推理稳定性。
    allow_hidden_cache_update: true
    # false: 不把 forward 的 node state 写回模型缓存。
    allow_node_state_writeback: node
  both:
    # mode=both 时，inference_only 前是否重置并重载 init checkpoint。
    reload_init_before_inference: true
  export:
    # 导出项开关：只保留完整 3DGS state(.pt) 与评估产物；禁用 lossy PLY 导出。
    save_3dgs_init: true
    save_3dgs_best: true
    save_3dgs_final: true
    save_ply: false
    save_rendered_images: true
    save_per_view_metrics_json: true

logging:
  # 测试阶段日志与性能观测。
  image_interval_blocks: 6
  low_psnr_train_images_subdir: train_low_psnr
  enable_jsonl_metrics: true
  use_tensorboard: true
  diagnostics:
    enable: false
    interval: 500
    window_size: 50
    save_branch_renders: true
  performance:
    enable: true
    phase_timing: true
    cuda_memory: false

# -----------------------------------------------------------------------------
# 故障排查（与终端日志对应）
#
# 1) test_image_stride < 0
#    → 非法配置，直接 fast-fail。
#
# 2) max_test_images != 0
#    → 与“测试时评估全部 test frames（exhaustive）”冲突，直接 fast-fail。
#      当前 resolve_test_image_refs_deterministic() 在 max_test_images > 0 时会裁剪 refs。
#
# 3) test_image_stride > 0 且某 segment 的 train/test 任一为空
#    → 配置与数据切分语义冲突，直接 fast-fail。
#
# 4) test_image_stride == 0
#    → 合法。语义是所有 frames 同时用于训练和测试，不视为错误。
#
# 5) 「Skip scene_id=N because scene cannot be loaded」
#    → dataset.get_scene(N) 得到 None（路径错误、数据损坏或场景不可用等）。
#      正式测试建议先修复加载问题，再运行 runner。
# -----------------------------------------------------------------------------
