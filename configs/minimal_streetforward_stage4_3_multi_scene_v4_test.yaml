# Stage4.3 多场景 V4 正式测试配置模板（供 tools/test_minimal_streetforward_stage4_3.py 使用）。
# 继承/对齐训练配置字段；这里给出测试相关建议值。
output_name: minimal_sf_stage4_3_multi_scene_v4_test

data:
  data_root: "/root/autodl-tmp/nuScenes/"
  dataset: "nuscenes"
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  sky_mask_semantics: one_is_sky
  # 测试 runner 仅消费 eval_scene_ids；此处 train_scene_ids 不参与正式 hold-out 统计。
  train_scene_ids: []
  eval_scene_ids: [0]
  preload:
    enable: true
    num_workers: 1
    max_pending_tasks: 64
    enable_view_pack_cache: true
    view_cache_max_items_total: 32
    view_cache_max_items_per_scene: 16
    view_cache_device: cpu
    drop_stale_hints: true
    dedupe_tasks: true
    warm_segment_static: true
    warm_segment_pointcloud: true
    warm_next_block_exact: true
    warm_test_refs: true
    warm_episode_source_superset: true
    warm_overlap_pairs_episode_superset: true
    warm_overlap_pairs_next_block_exact: true
    stats_log_interval_steps: 0
  pixel_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2, 3, 4, 5]
    downscale_when_loading: [3, 3, 3, 3, 3, 3]
    downscale: 1
    undistort: False
    # 正式测试必须非 0。
    test_image_stride: 8
    # 正式测试必须 > 0。
    max_test_images: 8
    load_sky_mask: true
    load_dynamic_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 1
    lidar_percentile: 0.02

dataset:
  num_source_keyframes: 1
  num_target_keyframes: 3
  segment_overlap_ratio: 0.2
  min_keyframes_per_scene: 2
  min_keyframes_per_segment: 2
  preload_scene_count: 2
  keyframe_split_config:
    num_splits: 0
    min_count: 1
    min_length: 2.0
  segment_aabb:
    - [-40.0, -20.0, -20.0]
    - [40.0, 4.8, 60.0]
  pointcloud:
    type: "hybrid"
    lidar_sparsity: full
    monocular_chosen_cam_ids: [0, 1, 2, 3, 4, 5]
    monocular_sparsity: full
    monocular_filter_sky: true
    monocular_depth_consistency: false
    monocular_downscale: 2
    monocular_dynamic_recovery_bbox_expand_xyz_m: [0.5, 0.2, 0.5]
    monocular_dynamic_recovery_max_points_per_instance: 20000
    near_max_points: 400000
    distant_max_points: 800000
    static_instance_motion:
      enable: true
      traj_length_thresh_m: 0.5

multi_scene:
  include_test: false

scheduler_v3:
  enable: false
  model_node_state:
    sync_with_scheduler: true

scheduler_v4:
  enable: true
  time_base:
    state_write_interval_steps: 4
  source_block:
    updates_per_block: 24
  reset_episode:
    keyframes_per_episode: 3
    episodes_per_segment: 1
    keyframe_window_policy: random_contiguous_window
    pair_order_policy: shuffle_without_replacement
  target_sampling:
    total_target_images: 3
    include_source: true
    extra_target_policy: same_cam_different_keyframe
    prefer_nearby_keyframes: true
    fallback_expand_to_segment: true
    fallback_with_replacement: true
    temporal_neighbor_pool: ring
    temporal_neighbor_max_ring: 2
    temporal_neighbor_cams: [0, 1, 2, 3, 4, 5]
  overlap:
    mode: pointcloud_topk
    stats_log_interval_steps: 0
    point_sample_size: 32768
    candidate_frame_policy: middle
    score_type: nab_over_na
    overlap_min: 0.7
  preload:
    emit_hints: true
    execute_hints: true
  traversal:
    fixed_scene_id: null
    fixed_segment_id: null

model:
  scale_init_value: 0.1
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  use_fused_cuda_backproject_v2: true
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  update_node_state_interval: 1
  reset_node_state_interval: 10
  sky:
    resolution: 600
    radius: 75.0
    center: [0.0, 0.0, 0.0]
    hemisphere: true
    hemisphere_up: [0.0, -1.0, 0.0]
  branches:
    bg:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.30
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.1
      limits:
        offset_max: 0.1
        scale_max: 0.1
        omega_max: 0.1
        opacity_max: 0.1
        sh_dc_max: 0.1
        sh_rest_max: 0.05
      eta:
        means: 1.0
        scales: 1.0
        opacity: 1.0
        sh_dc: 1.0
        sh_rest: 1.0
      mlp:
        hidden_dim: 64
        use_3d_feat: true
        use_2d_feat: true
        freeze_quat: false
    distant:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: true
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -1.90
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.05
      limits:
        offset_max: 0.02
        scale_max: 0.08
        omega_max: 0.01
        opacity_max: 0.05
        sh_dc_max: 0.08
        sh_rest_max: 0.015
      eta:
        means: 0.2
        scales: 0.7
        opacity: 0.5
        sh_dc: 0.8
        sh_rest: 0.4
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: true
    sky:
      src_backproject_support_min: 1e-6
      enable_selective_update: false
      freeze_means: true
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -0.50
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.05
      limits:
        offset_max: 0.02
        scale_max: 0.08
        omega_max: 0.01
        opacity_max: 0.05
        sh_dc_max: 0.08
        sh_rest_max: 0.015
      eta:
        means: 0.2
        scales: 0.7
        opacity: 0.5
        sh_dc: 0.8
        sh_rest: 0.4
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: true
    rigid:
      src_backproject_support_min: 1e-6
      freeze_means: false
      init:
        scale_init:
          mode: isotropic
          isotropic_log_value: -2.10
          knn_k: 3
          knn_log_scale_bias: 0.0
        opacity_init: 0.10
      limits:
        offset_max: 0.05
        scale_max: 0.08
        omega_max: 0.05
        opacity_max: 0.08
        sh_dc_max: 0.08
        sh_rest_max: 0.03
      eta:
        means: 0.5
        scales: 0.8
        opacity: 0.8
        sh_dc: 0.8
        sh_rest: 0.5
      mlp:
        hidden_dim: 64
        use_3d_feat: false
        use_2d_feat: true
        freeze_quat: false

losses:
  rgb: {w: 1.0}
  ssim: {w: 0.05}
  mask:
    w: 0.02
    opacity_loss_type: bce
  opacity_entropy: {w: 0.0}

optimizer:
  lr: 1.0e-4
  eps: 1.0e-15
  weight_decay: 0.0

training:
  max_iterations: 10000000
  log_interval: 100
  save_checkpoint_freq: 20000
  seed: 42

eval:
  enable_psnr: true
  save_train_views_psnr_below: 14
  run_test_at_end: false

test:
  enable: true
  mode: adapt_supervised
  runner:
    fixed_scene_id: null
    fixed_segment_id: null
    deterministic: true
    seed: 123
    source_protocol: middle_keyframe_middle_frame_cam0
    max_segments_per_scene: 0
    min_test_views_per_segment: 6
  split:
    require_eval_scene_ids: true
    require_nonzero_test_stride: true
    require_nonempty_test_views: true
  adapt_supervised:
    enable: true
    max_steps_per_segment: 2000
    validate_every_blocks: 1
    early_stop_patience: 8
    keep_best_by: psnr
    reset_runtime_state_each_segment: true
  inference_only:
    enable: true
    allow_hidden_cache_update: false
    allow_node_state_writeback: false
    eval_chunk_size: 16
  both:
    reload_init_before_inference: true
  export:
    save_3dgs_init: true
    save_3dgs_best: true
    save_3dgs_final: true
    save_ply: true
    save_rendered_images: true
    save_per_view_metrics_json: true

logging:
  image_interval_blocks: 6
  low_psnr_train_images_subdir: train_low_psnr
  enable_jsonl_metrics: true
  use_tensorboard: true
  diagnostics:
    enable: false
    interval: 500
    window_size: 50
    save_branch_renders: true
  performance:
    enable: true
    phase_timing: true
    cuda_memory: false
