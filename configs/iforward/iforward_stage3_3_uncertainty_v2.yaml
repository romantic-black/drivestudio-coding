        fixed_center_chunk_size: 65536
        center_by_parent: true
        valid_row_filter: true
        detach_child_detail: false
        train_child_detail_every_n: 1
        backend: cuda
    parent_optimizer_mamba:
      enable: false
    parent_optimizer_memory:
      enable: true
      type: lowrank_gated_delta_kv
      event_dim: 64
      ctx_dim: 32
      key_dim: 16
      value_dim: 32
      token_dim: 64
      read_every_repeat: true
      write_every_repeat: true
      reset_scope: episode
      detach_scope: rollout_boundary
      write_mask:
        support_min: 0.001
        require_valid: true
      write_token:
        include_spatial_event: true
        include_parent_event: true
        include_delta_summary: true
        include_visit_embedding: true
      visit_embedding:
        output_dim: 32
        kinds: [bootstrap, assimilation, repair, repeat_stability]
        repeat_idx_max: 16
        repeat_budget_max: 16
      fusion:
        gate_init:
          bootstrap: 0.0
          assimilate: 0.05
          repair: 0.03
          repeat_stability: 0.03
      gated_delta_kv:
        update_rule: balanced_residual_delta_v1
        K: 16
        V: 32
        query_rms_unit: true
        key_rms_unit: true
        value_rms_max: 2.0
        ctx_rms_max: 4.0
        state_rms_max: 4.0
        alpha_mode: value_channel
        alpha_max: 1.0
        alpha_init: 0.10
        surprise_gating: true
        surprise_target_rms: 1.0
        min_alpha_on_unseen: 0.5
        cleanup_enable: true
        cleanup_key: learned
        cleanup_max: 0.2
        cleanup_init: 0.02
        cleanup_by_kind:
          bootstrap: 0.0
