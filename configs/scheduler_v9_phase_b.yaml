scheduler_v9:
  enable: true
  phase: phase_B_viewset_rollout
  fail_fast: true

  block:
    steps_per_block: 1

  episode:
    blocks_per_episode: 8
    include_source_frame: true
    target_policy: visited_episode_frames
    reset_policy: episode_end
    block_source_frame_policy: random_within_keyframe_per_visit
    frame_within_keyframe_policy: random_once_per_episode
    min_keyframes_required_policy: use_available_if_less_than_window
    source_mode: keyframes

  traversal:
    mode: round_robin_episode_interleave
    switch_after_episode: true
    fixed_scene_id: null
    fixed_segment_id: null
    segment_order: ascending
    scene_order: shuffle_per_epoch

  execution:
    block_order: step_major
    step_major_switch_interval_steps: 4
    reset_policy: episode_end

  preload:
    emit_hints: true
    warm_next_block_exact: true
    warm_next_episode_chain: true
    warm_v9_role_refs: true

  phase_A:
    block:
      inner_K_choices: [2, 4, 6]
      inner_K_probs: [0.45, 0.40, 0.15]
      block_loss_policy: source_frame_all_cams
    nearby_supervision:
      enable: true
      policy: adjacent_then_random_same_keyframe
      frames_per_block: 2
      adjacent_radius: 1
      random_fill: true
      same_keyframe_only: true
      insufficient_policy: skip
      exclude_source_frame: true
      exclude_existing_block_loss_frames: true
      camera_policy: all_cams
      apply_final_step_only: true
      loss_weight: 0.25
      loss_warmup_steps: 2000
      role_name: phaseA_nearby

  phase_B:
    mode: viewset_rollout
    episode:
      keep_episode: true
      keep_keyframe: true
      window_blocks: 8
      reset_vsm_on_episode_end: true
    block:
      repeat_block_iteration: false
      block_semantics: event_candidate
    rollout:
      K_choices: [2, 4]
      K_probs: [0.65, 0.35]
      sample_event_frames: random_blocks_in_episode
      event_order: chronological
      distinct_event_frames: true
    prefix_render:
      policy: current_plus_random_previous
      intermediate_views: 2
      final_views: 3
      max_refs_per_step: 18
    query_observation:
      enable: true
      query_frame_policy: heldout_inside_event_span
      frames_per_rollout: 1
      cameras_per_frame: all_cams
      exclude_event_frames: true
    masks:
      vsm_scope: bg_static
      evidence_mask: valid_non_sky_non_egocar_non_dynamic
      prefix_loss_mask: valid_non_sky_non_egocar_non_dynamic
      query_label_mask: valid_non_sky_non_egocar_non_dynamic

  leakage_check:
    enable: true
    nearby_not_in_evidence: true
    query_not_in_evidence: true
    aux_not_in_evidence: true
    same_scene_segment_required: true
    role_count_match_required: true
    forbid_test_refs_in_train: true
