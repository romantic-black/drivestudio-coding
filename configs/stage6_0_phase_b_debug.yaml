      enable: false
    offset_regularization:
      enable: true
      weight: 1.0e-4
      bg_means_l2: 1.0
      rigid_means_l2: 1.0
      opacity_l2: 0.1
      scales_l2: 0.1
  photometric:
    exclude_sky_region: true
