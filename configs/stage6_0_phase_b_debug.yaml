    save_full_local_state_cache: false
    cache_distant: false
    activation_checkpoint:
      enable: false
    final_render_micro_backward:
      enable: false

optimizer:
  type: adamw
  lr:
    long_vsm: 3.0e-4
    offset_decoder: 3.0e-4
    default: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  filter_frozen: true
  no_weight_decay:
    enable: true
    name_keywords:
      - ".bias"
      - "bias"
      - "norm"
      - "Norm"
      - "ln"
      - "LayerNorm"
      - "embedding"
      - "Embedding"
    ndim_leq: 1
  groups:
    long_vsm:
      match:
        prefixes:
          - "stage6_long_vsm"
      lr: 3.0e-4
      weight_decay: 0.01
    offset_decoder:
      match:
        prefixes:
          - "stage6_long_offset_decoder"
      lr: 3.0e-4
      weight_decay: 0.01
    default:
      lr: 0.0
      weight_decay: 0.0

lr_scheduler:
