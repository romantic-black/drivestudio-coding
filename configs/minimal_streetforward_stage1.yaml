# Minimal StreetForward Stage 1 — NodeState + single target, overfit one batch
# Same schema as Stage 0; adds model.update_node_state_interval, output_name.
# Use with: python tools/train_minimal_streetforward_stage1.py --config_file configs/minimal_streetforward_stage1.yaml overfit_batch_path=./data/overfit_batches/scene0_seg0_batch.pt

# Output directory name (log_dir = output_root / project / output_name)
output_name: minimal_sf_stage1

data: {}

dataset:
  segment_aabb: [[-40.0, -20.0, -20.0], [40.0, 4.8, 70.0]]
  segment_input_aabb: [[-40.0, -20.0, -20.0], [40.0, 4.8, 70.0]]

model:
  offset_max: 0.1
  scale_max: 0.1
  omega_max: 0.1
  opacity_max: 0.1
  sh_dc_max: 0.1
  sh_rest_max: 0.05
  eta_means: 1.0
  eta_scales: 1.0
  eta_opacity: 1.0
  eta_sh_dc: 1.0
  eta_sh_rest: 1.0
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  # Stage 1 only: write render params back to NodeState every N steps; 0 = never, 1 = every step
  update_node_state_interval: 10
  # Reset cached NodeState every N steps (executed at update boundary)
  reset_node_state_interval: 10

optimizer:
  lr: 1.0e-3
  eps: 1.0e-15
  weight_decay: 0.0

training:
  max_iterations: 1000
  log_interval: 50
  save_checkpoint_freq: 500
  seed: 42

eval:
  enable_psnr: true
  metric_interval: 10
  heavy_metric_interval: 50
  run_test_at_end: true

logging:
  image_interval: 50
  enable_jsonl_metrics: true
  use_tensorboard: true
