base_config_file: /root/autodl-tmp/outputs/minimal_sf_stage4_6_multi_scene_v7/experiment002/config.yaml

model:
  stage: '4_6'

data:
  assets:
    root: /root/autodl-tmp/streetforward_assets_pt120w

dataset:
  pointcloud:
    near_max_points: 400000
    distant_max_points: 800000

scheduler_v8:
  enable: true
  block:
    steps_per_block: 8
  episode:
    blocks_per_episode: 5
    total_target_frames: 3
    include_source_frame: true
    target_policy: visited_episode_frames
    frame_within_keyframe_policy: random_once_per_episode
    min_keyframes_required_policy: skip_if_less_than_window
  traversal:
    mode: round_robin_episode_interleave
    switch_after_episode: true
    fixed_scene_id: null
    fixed_segment_id: null
    segment_order: ascending
    scene_order: shuffle_per_epoch
  execution:
    block_order: step_major
    step_major_switch_interval_steps: 8
    reset_policy: episode_end
  preload:
    emit_hints: true
    warm_next_block_exact: true
    warm_next_episode_chain: true

batch_eval:
  enable: true
  output_dir: /root/autodl-tmp/outputs/batch_eval_v8_stage4_6
  data_mode: segment_finetune_train

  checkpoint:
    path: "/root/autodl-tmp/outputs/minimal_sf_stage4_6_multi_scene_v7/experiment002/checkpoints/minimal_sf_stage4_6_multi_scene_v7_step50000.pt"
    strict: true

  dataset:
    scene_ids: [115]
    segment_policy: all
    start_at:
      scene_id: 115
      segment_id: 1
      frame_id: 96
    require_full_window: true
    stride: 30
    max_episodes_per_scene: null
    max_total_episodes: null
    window_policy: sliding

  cameras:
    ids: [0, 1, 2]
    names: ["front", "front_left", "front_right"]

  runtime:
    mode: segment_finetune_train
    no_grad: false
    amp: false
    reset_state_per_episode: true
    align_with_scheduler_v7: false
    align_with_scheduler_v8: true
    update_node_state: true
    update_hidden_state: true
    update_view_transient: true
    block_order: step_major
    step_major_switch_interval_steps: 8
    reset_policy: episode_end
    target_frame_policy: visited_episode_frames
    max_target_frames_including_source: 3

  sky_eval:
    # Stage4_6 has no internal sky branch and training excludes sky-region
    # photometric loss. Compose the frozen SkyBranch for full-image metrics.
    enable: true
    config_file: configs/skybranch_stage5_4_exp002.yaml
    checkpoint: "/root/autodl-tmp/outputs/skybranch_stage5_4_exp002/checkpoints/skybranch_resume_step_100000.pth"
    strict: true
    freeze_params: true
    compose_for_metrics: true
    reset_runtime_state_per_episode: true

  history:
    update_step_norm_ema: true
    record_support_residual_on_input_exit: false
    record_each_step: false

  render:
    save_pre_update: true
    save_each_iter_views: false
    save_png: true
    save_video: false
    save_numpy: false
    save_depth_or_acc: false

  metrics:
    primary_mask: full_image
    report_full_image: true
    compute_psnr: true
    compute_ssim: true
    compute_lpips: true
    compute_l1: true
    min_valid_pixels: 32

  experiments:
    - name: exp_v8_10_5_stage4_6
      sequence_length: 6
      input_offsets: [0, 2, 4]
      eval_offsets: all
      steps_per_input: 8
