base_config_file: /root/autodl-tmp/outputs/minimal_sf_stage5_4_multi_scene_v8_adamw_warmcos/experiment002_60w_40w_12block_base_on_001/config.yaml

batch_eval:
  enable: true
  output_dir: /root/autodl-tmp/outputs/batch_eval_10_stage5_4
  data_mode: segment_finetune_train

  checkpoint:
    path: "/root/autodl-tmp/outputs/minimal_sf_stage5_4_multi_scene_v8_adamw_warmcos/experiment002_60w_40w_12block_base_on_001/checkpoints/minimal_sf_stage5_4_multi_scene_v8_step50000.pt"
    strict: true

  dataset:
    scene_ids: [10, 140, 194, 142, 114, 121]
    segment_policy: all
    require_full_window: true
    stride: 30
    max_episodes_per_scene: null
    max_total_episodes: null
    window_policy: sliding

  cameras:
    ids: [0, 1, 2]
    names: ["front", "front_left", "front_right"]

  runtime:
    mode: inference_only
    no_grad: true
    amp: false
    reset_state_per_episode: true
    align_with_scheduler_v8: true
    update_node_state: true
    update_hidden_state: true
    update_view_transient: true

  history:
    update_step_norm_ema: true
    record_support_residual_on_input_exit: true
    record_each_step: false

  render:
    save_pre_update: true
    save_each_iter_views: false
    save_png: true
    save_video: false
    save_numpy: false
    save_depth_or_acc: false

  metrics:
    primary_mask: full_image
    report_full_image: true
    compute_psnr: true
    compute_ssim: true
    compute_lpips: false
    compute_l1: true
    min_valid_pixels: 32

  experiments:
    - name: exp2_10_5_stage5_4
      sequence_length: 10
      input_offsets: [1, 3, 5, 7, 9]
      eval_offsets: all
      steps_per_input: 8
