output_name: minimal_sf_stage4_4_multi_scene_v6

data:
  data_root: "/root/autodl-tmp/nuScenes/"
  dataset: "nuscenes"
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  sky_mask_semantics: one_is_sky
  train_scene_ids: [0, 1]
  eval_scene_ids: []
  preload:
    enable: false
    num_workers: 1
    max_pending_tasks: 64
    dedupe_tasks: true
    drop_stale_hints: true
    warm_scene_meta: true
    warm_segment_static: true
    warm_next_block_exact: true
    warm_test_refs: false
    warm_episode_source_superset: true
    enable_view_pack_cache: true
    stats_log_interval_steps: 0
  pixel_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2, 3, 4, 5]
    downscale_when_loading: [3, 3, 3, 3, 3, 3]
    downscale: 1
    undistort: false
    test_image_stride: 0
    max_test_images: 0
    load_sky_mask: true
    load_dynamic_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 1
    lidar_percentile: 0.02
  assets:
    root: "/root/autodl-tmp/nuScenes_assets"
  scene_asset_cache_max_items: 64
  segment_static_cache_max_items: 128
  image_meta_cache_max_items: 8192
  view_pack_cache_max_items: 4096

dataset:
  num_source_keyframes: 1
  num_target_keyframes: 3
  segment_overlap_ratio: 0.2
  min_keyframes_per_scene: 2
  min_keyframes_per_segment: 2
  preload_scene_count: 2
  keyframe_split_config:
    num_splits: 0
    min_count: 1
    min_length: 2.0
  segment_aabb:
    - [-20.0, -10.0, -20.0]
    - [20.0, 4.8, 60.0]
  pointcloud:
    type: "hybrid"
    lidar_sparsity: full
    monocular_chosen_cam_ids: [0, 1, 2, 3, 4, 5]
    monocular_sparsity: full
    monocular_filter_sky: true
    monocular_depth_consistency: false
    monocular_downscale: 2
    monocular_dynamic_recovery_bbox_expand_xyz_m: [0.5, 0.2, 0.5]
    monocular_dynamic_recovery_max_points_per_instance: 40000
    near_max_points: 600000
    distant_max_points: 1200000
    static_instance_motion:
      enable: true
      traj_length_thresh_m: 0.5

multi_scene:
  include_test: false

scheduler_v3:
  enable: false
  model_node_state:
    sync_with_scheduler: true

scheduler_v6:
  enable: true
  time_base:
    state_write_interval_steps: 4
  source_block:
    updates_per_block: 24
  reset_episode:
    keyframes_per_episode: 12
    episodes_per_segment: 1
  target_sampling:
    include_source_frame: true
    total_target_frames: 3
    neighbor_ring: 2
    prefer_nearby_keyframes: true
    fallback_expand_to_segment: true
    with_replacement: true
  traversal:
    fixed_scene_id: null
    fixed_segment_id: null

model:
  scale_init_value: 0.1
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  use_fused_cuda_backproject_v2: true
  use_fused_cuda_backproject_v3: true
  use_fused_cuda_backproject_v4: true
  fused_cuda_backproject_v4_force_fallback: false
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  update_node_state_interval: 1
  reset_node_state_interval: 10
  sky:
    resolution: 500
    radius: 50.0
    center: [0.0, 0.0, 0.0]
    hemisphere: true
    hemisphere_up: [0.0, -1.0, 0.0]

losses:
  rgb: {w: 1.0}
  ssim: {w: 0.05}
  mask: {w: 0.02, opacity_loss_type: bce}
  opacity_entropy: {w: 0.0}

optimizer:
  lr: 1.0e-4
  eps: 1.0e-15
  weight_decay: 0.0

training:
  max_iterations: 10000000
  log_interval: 100
  save_checkpoint_freq: 20000
  seed: 42

eval:
  enable_psnr: true
  save_train_views_psnr_below: 14
  run_test_at_end: false

logging:
  image_interval_blocks: 6
  low_psnr_train_images_subdir: train_low_psnr
  enable_jsonl_metrics: true
  use_tensorboard: true
  diagnostics:
    enable: false
    interval: 500
    window_size: 50
    save_branch_renders: true
  performance:
    enable: true
    phase_timing: true
    cuda_memory: false

