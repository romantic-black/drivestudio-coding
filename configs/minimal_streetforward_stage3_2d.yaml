# Minimal StreetForward Stage 3: 2D branch (mandatory) + bg + distant (mandatory)
# Inherits stage2_1; adds feat_2d_*, param_embed_dim/offset_gru_hidden_dim for fused dim 48.
# Use with: python tools/train_minimal_streetforward_stage3_2d.py --config_file configs/minimal_streetforward_stage3_2d.yaml overfit_batch_path=./data/overfit_batches/scene0_seg0_batch.pt

output_name: minimal_sf_stage3_2d

data: {}

dataset:
  segment_aabb: [[-40.0, -20.0, -20.0], [40.0, 4.8, 70.0]]

model:
  offset_max: 0.1
  scale_max: 0.1
  scale_init_value: 0.1
  omega_max: 0.1
  opacity_max: 0.1
  sh_dc_max: 0.1
  sh_rest_max: 0.05
  eta_means: 1.0
  eta_scales: 1.0
  eta_opacity: 1.0
  eta_sh_dc: 1.0
  eta_sh_rest: 1.0
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  update_node_state_interval: 1
  reset_node_state_interval: 10

optimizer:
  lr: 1.0e-3
  eps: 1.0e-15
  weight_decay: 0.0

training:
  max_iterations: 1000
  log_interval: 50
  save_checkpoint_freq: 500
  seed: 42
  num_targets: 6

eval:
  enable_psnr: true
  metric_interval: 10
  heavy_metric_interval: 50
  run_test_at_end: true

logging:
  image_interval: 100
  enable_jsonl_metrics: true
  use_tensorboard: true
