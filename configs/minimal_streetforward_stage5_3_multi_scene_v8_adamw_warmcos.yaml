output_name: experiment003_120w_adamw_warmcos

data:
  data_root: "/root/autodl-tmp/nuScenes/"
  dataset: "nuscenes"
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  sky_mask_semantics: one_is_sky
  train_scene_ids: [5, 6, 7,]
  eval_scene_ids: [0, 1, 2, 3, 4]
  preload:
    enable: true
    num_workers: 1
    max_pending_tasks: 64
    dedupe_tasks: true
    drop_stale_hints: true
    warm_scene_meta: true
    warm_segment_static: true
    warm_next_block_exact: true
    warm_test_refs: false
    warm_episode_source_superset: true
    enable_view_pack_cache: true
    stats_log_interval_steps: 0
  pixel_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2, 3, 4, 5]
    downscale_when_loading: [3, 3, 3, 3, 3, 3]
    downscale: 1
    undistort: false
    load_sky_mask: true
    load_dynamic_mask: true
    load_egocar_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 1
    lidar_percentile: 0.02
  assets:
    root: "/root/autodl-tmp/streetforward_assets_pt120w"
  scene_asset_cache_max_items: 64
  segment_static_cache_max_items: 128
  image_meta_cache_max_items: 8192
  view_pack_cache_max_items: 4096

dataset:
  num_source_keyframes: 1
  num_target_keyframes: 3
  segment_overlap_ratio: 0.2
  min_keyframes_per_scene: 2
  min_keyframes_per_segment: 2
  preload_scene_count: 2
  keyframe_split_config:
    num_splits: 0
    min_count: 1
    min_length: 2.0
  segment_aabb:
    - [-20.0, -10.0, -20.0]
    - [20.0, 4.8, 60.0]
  pointcloud:
    type: "hybrid"
    lidar_sparsity: full
    monocular_chosen_cam_ids: [0, 1, 2, 3, 4, 5]
    monocular_sparsity: full
    monocular_filter_sky: true
    monocular_depth_consistency: false
    monocular_downscale: 2
    monocular_dynamic_recovery_bbox_expand_xyz_m: [0.5, 0.2, 0.5]
    monocular_dynamic_recovery_max_points_per_instance: 20000
    near_max_points: 400000
    distant_max_points: 800000
    static_instance_motion:
      enable: true
      traj_length_thresh_m: 0.5

scheduler_v8:
  enable: true
  block:
    steps_per_block: 8
  episode:
    blocks_per_episode: 5
    total_target_frames: 3
    include_source_frame: true
    target_policy: visited_episode_frames
    frame_within_keyframe_policy: random_once_per_episode
    min_keyframes_required_policy: skip_if_less_than_window
  traversal:
    mode: round_robin_episode_interleave
    switch_after_episode: true
    fixed_scene_id: null
    fixed_segment_id: null
    segment_order: ascending
    scene_order: shuffle_per_epoch
  execution:
    block_order: step_major
    step_major_switch_interval_steps: 4
    reset_policy: episode_end
  preload:
    emit_hints: true
    warm_next_block_exact: true
    warm_next_episode_chain: true

validation_v8:
  eval_enable: false
  mode: inference_only  # segment_finetune_train
  block:
    steps_per_block: 16
  episode:
    blocks_per_episode: 5
    total_target_frames: 3
    target_policy: visited_episode_frames
  execution:
    block_order: step_major
    step_major_switch_interval_steps: 4
    reset_policy: episode_end
  trigger:
    by: train_episode_interval
    validate_every_n_episodes: 100
    run_at_train_start: false
  episode_selection:
    policy: middle
  render:
    save_images: true
    save_dir: validation/episodes
  cache:
    persist_across_training: true
  metrics:
    use_sky_mask_regions: true
    min_valid_pixels_per_region: 32
    require_sky_mask: true

model:
  stage: "5_3"
  production_training: true
  scale_init_value: 0.1
  sh_degree: 1
  voxel_size: 0.2
  sparseConv_outdim: 32
  feat_2d_channels: 32
  feat_2d_downscale: 1
  feature_extractor:
    type: dinov2_unet_fusion
    dino:
      model_name: vit_base_patch14_reg4_dinov2
      pretrained: true
      freeze: true
      weights_path: null
      out_channels: 32
      intermediate_layers: [4, 8, 11]
      pad_to_patch_multiple: 14
    residual_unet:
      in_channels: 6
      feat_channels: 32
      base_channels: 32
      feature_downscale: 1
      depth: 4
      bilinear: true
    fusion:
      hidden_channels: 64
      out_channels: 32
  use_fused_cuda_backproject_v2: true
  use_fused_cuda_backproject_v3: true
  use_fused_cuda_backproject_v4: false
  fused_cuda_backproject_v4_force_fallback: false
  param_embed_dim: 48
  offset_gru_hidden_dim: 48
  offset_gru_use_reset_gate: true
  rigid_routed:
    route_space: source_frame_world
    route_aabb: segment_aabb
    inside_decoder: bg
    outside_decoder: distant
    update_means: true
    update_quat: true
  struct_decoder:
    enable: true
    type: "routed_near_far"
    scope: "full_routed"
    output_role: "gru_input"
    point_preserving: true
    include_bg: true
    include_distant: true
    include_rigid_in: true
    include_rigid_out: true
    feat_2d_channels: 32
    param_embed_dim: 32
    branch_embed_dim: 8
    support_embed_dim: 8
    history_embed_dim: 16
    token:
      use_2d_feat: true
      use_support: true
      use_branch_embed: true
      use_param_embed: true
      use_anchor_rgb: false
      use_hidden_state: false
      zero_invalid_2d_feat: true
    near:
      type: "xcpe"
      branches: ["bg", "rigid_in"]
      channels: 64
      voxel_size: 0.20
      sparse_backend: "spconv"
      clamp_grid_coord: false
      xcpe:
        num_layers: 2
        kernel_size: 3
        residual_scale_init: 5.0e-3
        norm: "layernorm"
        act: "gelu"
    far:
      type: "mlp"
      branches: ["distant", "rigid_out"]
      channels: 64
      hidden_dim: 64
      num_layers: 2
      norm: "layernorm"
      act: "gelu"
  history_memory:
    enable: true
    record_on: "block_exit"
    record_views: "source_image_refs"
    support:
      ema_beta_visible: 0.75
      ema_beta_invisible: 0.90
    residual:
      error_beta: 0.75
      error_eps: 1.0e-6
    update:
      ema_beta: 0.92
      apply_in_eval: true
  update_gate:
    enable: true
    hidden_dim: 64
    min_gate: 0.0
    init_bias: 0.0
    warmup_steps: 1000
    require_initialized_in_input: true
    include_visible_now: true
    bind_with_mask_update: true
  branches:
    bg:
      src_backproject_support_min: 1e-2
      enable_selective_update: false
      freeze_means: false
      init: {scale_init: {mode: knn, isotropic_log_value: -2.30, knn_k: 8, knn_log_scale_bias: -1.3}, opacity_init: 0.1}
      limits: {offset_max: 0.1, scale_max: 0.1, omega_max: 0.1, opacity_max: 0.1, sh_dc_max: 0.1, sh_rest_max: 0.05}
      eta: {means: 1.0, scales: 1.0, opacity: 1.0, sh_dc: 1.0, sh_rest: 1.0}
      mlp: {hidden_dim: 64, use_3d_feat: true, use_2d_feat: true}
    distant:
      src_backproject_support_min: 1e-2
      enable_selective_update: false
      freeze_means: true
      init: {scale_init: {mode: isotropic, isotropic_log_value: -1.90, knn_k: 8, knn_log_scale_bias: -1.5}, opacity_init: 0.05}
      limits: {offset_max: 0.02, scale_max: 0.08, omega_max: 0.01, opacity_max: 0.05, sh_dc_max: 0.08, sh_rest_max: 0.015}
      eta: {means: 0.2, scales: 0.7, opacity: 0.5, sh_dc: 0.8, sh_rest: 0.4}
      mlp: {hidden_dim: 64, use_3d_feat: false, use_2d_feat: true, freeze_quat: true}
    rigid:
      src_backproject_support_min: 1e-2
      init: {scale_init: {mode: knn, isotropic_log_value: -2.90, knn_k: 8, knn_log_scale_bias: -1.5}, opacity_init: 0.2}
      eta: {means: 0.5, scales: 0.8, opacity: 0.8, sh_dc: 0.8, sh_rest: 0.5}

training_recipe:
  name: stage5_3_adamw_warmcos_v1

losses:
  photometric:
    exclude_sky_region: true
  rgb: {w: 1.0}
  ssim: {w: 0.05}
  mask: {w: 0.02, opacity_loss_type: bce, require_sky_mask: true}
  opacity_entropy: {w: 0.0}

optimizer:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  filter_frozen: true
  no_weight_decay:
    enable: true
    name_keywords:
      - ".bias"
      - "bias"
      - "norm"
      - "Norm"
      - "ln"
      - "LayerNorm"
      - "embedding"
      - "Embedding"
    ndim_leq: 1
  groups:
    dino:
      match:
        prefixes:
          - "image_feature_extractor.dino_adapter.backbone"
      lr: 0.0
      weight_decay: 0.0
    residual_unet:
      match:
        prefixes:
          - "image_feature_extractor.residual"
          - "image_feature_extractor.residual_unet"
      lr: 1.0e-4
      weight_decay: 1.0e-4
    fusion_neck:
      match:
        prefixes:
          - "image_feature_extractor.fusion"
          - "image_feature_extractor.fusion_neck"
      lr: 1.5e-4
      weight_decay: 1.0e-4
    struct_near_xcpe:
      match:
        prefixes:
          - "struct_decoder.near_decoder"
      lr: 1.5e-4
      weight_decay: 1.0e-4
    struct_far_mlp:
      match:
        prefixes:
          - "struct_decoder.far_decoder"
      lr: 1.0e-4
      weight_decay: 1.0e-4
    gate_history:
      match:
        prefixes:
          - "stage5_2_history_proj"
          - "stage5_2_gate_branch_embed"
          - "stage5_2_gate_mlp"
      lr: 5.0e-5
      weight_decay: 0.0
    recurrent_update:
      match:
        contains:
          - "offset_gru"
          - "mlp_offset"
          - "mlp_conv"
          - "mlp_opacity"
          - "gaussion_decoder"
          - "gaussian_decoder"
      lr: 8.0e-5
      weight_decay: 5.0e-5
    default:
      lr: 1.0e-4
      weight_decay: 1.0e-4

lr_scheduler:
  enable: true
  type: warmup_cosine
  interval: step
  warmup_steps: 3000
  total_steps: ${training.max_iterations}
  min_lr_ratio: 0.05
  warmup_start_ratio: 0.05

training:
  max_iterations: 10000010
  log_interval: 100
  save_checkpoint_freq: 10000
  seed: 41
  amp:
    enable: false
    dtype: fp16
  grad_clip:
    enable: true
    max_norm: 1.0
    norm_type: 2.0
  bad_step:
    policy: fast_fail
    fail_on_nonfinite_loss: true
    fail_on_nonfinite_grad: true
    fail_on_amp_overflow: false
    fail_on_grad_norm_gt: 100.0

eval:
  enable_psnr: true
  save_train_views_psnr_below: null
  run_test_at_end: false

logging:
  output_root: /root/autodl-tmp/outputs
  project: minimal_sf_stage5_3_multi_scene_v8_adamw_warmcos
  log_dir: null
  image_interval_blocks: 96
  train_monitor:
    enable_heavy_metrics: false
    include_per_view_metrics: false
    include_extra_result_metrics: false
    enable_low_psnr_image_dump: false
  low_psnr_train_images_subdir: train_low_psnr
  enable_jsonl_metrics: true
  use_tensorboard: true
  offset_monitor:
    enable: true
    near_radius_m: 5.0
    saturation_tanh_threshold: 0.95
  diagnostics:
    enable: false
    interval: 500
    window_size: 50
    save_branch_renders: true
  performance:
    enable: false
    phase_timing: true
    cuda_memory: false
