# StreetForward training configuration
# This configuration supports multi-scene training with RGB point cloud initialization

# data 字段直接配置 MultiSceneDataset 的 dataset（参考 docs/dataloader/MultiSceneDataset_Usage.md）
# 无需 dataset_preset，pixel_source、lidar_source 等在此完整配置
data:
  data_root: /root/autodl-tmp/nuScenes/  # data root for the dataset
  dataset: nuscenes  # dataset name（用于数据加载与 DATASETS_CONFIG）
  start_timestep: 0
  end_timestep: -1
  preload_device: cpu
  # MultiSceneDataset: loader float 语义见 pixel_source；此处声明如何归一化为 batch 内 **1=sky**
  sky_mask_semantics: one_is_sky

  # Training and evaluation scene IDs
  train_scene_ids: [0]
  eval_scene_ids: [0]
  
  pixel_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesPixelSource
    cameras: [0, 1, 2]
    downscale_when_loading: [3, 3, 3]
    downscale: 1
    undistort: False
    test_image_stride: 0
    max_test_images: 4
    load_sky_mask: true
    load_dynamic_mask: true
    load_depth_maps: true
    load_objects: true
    load_smpl: false
    sampler:  # error based image sampler
      buffer_downscale: 8  # downscale factor for the buffer wrt load_size
      buffer_ratio: 0.5  # the percentage of images sampled according to the error buffer
      start_enhance_weight: 3  # give more chance to sample starting frames, which usually have more errors
  
  lidar_source:
    type: datasets.nuscenes.nuscenes_sourceloader.NuScenesLiDARSource
    load_lidar: true
    lidar_downsample_factor: 4
    lidar_percentile: 0.02

# MultiSceneDataset configuration
dataset:
  # MultiSceneDataset parameters
  num_source_keyframes: 3
  num_target_keyframes: 6
  segment_overlap_ratio: 0.2
  min_keyframes_per_scene: 10
  min_keyframes_per_segment: 6
  preload_scene_count: 3
  
  keyframe_split_config:
    num_splits: 0
    min_count: 1
    min_length: 2.0
  
  # Segment AABB (required, seg0 coords): single source of truth for
  # - batch['aabb']
  # - model bbx_min/bbx_max
  segment_aabb: [[-20, -20, -20], [20, 4.8, 70]]
  
  # Point cloud generator configuration (moved from data.pointcloud)
  # 坐标系约定：crop_aabb / input_aabb 均相对于 segment 第一帧，点云与外参也会转换到该坐标系
  pointcloud:
    type: hybrid  # 生成器类型：monocular, lidar, 或 hybrid
    # LiDAR生成器参数
    lidar_sparsity: full  # LiDAR点云稀疏度：Drop90, Drop80, Drop50, Drop25, full
    # 单目生成器参数
    monocular_chosen_cam_ids: [0, 1, 2]  # 单目使用的相机ID列表
    monocular_sparsity: full  # 单目点云稀疏度
    monocular_filter_sky: true  # 单目是否过滤天空
    monocular_depth_consistency: false  # 单目是否使用深度一致性检查
    monocular_downscale: 2  # 单目下采样比例
    # 融合参数
    # 可选：基于 segment_aabb 内/外的近景/远景点数上限（仅 StreetForward/MultiScene 路径使用）
    # near_max_points: 400000   # 近景（segment_aabb 内）背景点数上限
    # distant_max_points: 100000  # 远景（segment_aabb 外）背景点数上限
    fusion_strategy: merge  # 融合策略：merge, lidar_first, adaptive
    dynamic_source: lidar_only  # 动态点云来源：lidar_only（推荐）或 fuse
    downsample_dynamic: false  # 动态点云是否下采样（默认False，推荐保持False）
    background_downsample_method: uniform  # 背景点云下采样方法：uniform, density, distance
    # NOTE: crop_aabb/input_aabb have been unified into dataset.segment_aabb/segment_input_aabb
    # and are no longer configured here.

# StreetForwardTrainer configuration
model:
  # Physical upper bounds (usually fixed)
  offset_max: 0.1          # Position offset upper bound (meters)
  scale_max: 0.1           # Scale offset upper bound (log domain)
  omega_max: 0.1           # Rotation offset upper bound (radians, ~5.7°)
  opacity_max: 0.1          # Opacity offset upper bound (logit domain)
  sh_dc_max: 0.1           # SH DC offset upper bound
  sh_rest_max: 0.05         # SH rest offset upper bound (smaller)
  
  # Step size factors (control offset magnitude)
  # Global defaults (used when eta_by_node is empty or node not specified)
  eta_means: 1.0           # Position step size factor
  eta_scales: 1.0          # Scale step size factor
  eta_opacity: 1.0         # Opacity step size factor
  eta_sh_dc: 1.0           # SH DC step size factor
  eta_sh_rest: 1.0         # SH rest step size factor

  # Per-node eta (ref: OmniRe Background vs RigidNodes lr ratios)
  # bg: baseline; rigid: 0.5x (more conservative); distant: 0.8x
  eta_by_node:
    bg:
      eta_means: 1.0
      eta_scales: 1.2
      eta_opacity: 1.5
      eta_sh_dc: 1.1
      eta_sh_rest: 0.9
    rigid:
      eta_means: 0.5
      eta_scales: 0.6
      eta_opacity: 0.75
      eta_sh_dc: 0.55
      eta_sh_rest: 0.45
    distant:
      eta_means: 0.8
      eta_scales: 0.96
      eta_opacity: 1.2
      eta_sh_dc: 0.88
      eta_sh_rest: 0.72

  # Other model parameters
  sh_degree: 1
  voxel_size: 0.4
  max_iterations: 1
  sparseConv_outdim: 32
  use_2d_features: true
  feat_2d_channels: 16
  feat_2d_downscale: 4
  # NOTE: bbx_min/bbx_max/input_aabb now come from dataset.segment_aabb/segment_input_aabb
  # and are intentionally not duplicated here.

# Optimizer configuration
optimizer:
  lr: 1e-3
  eps: 1e-8
  weight_decay: 0.0

# Training configuration
training:
  seed: 42  # 确定性复现，需配合 set_deterministic_seed
  max_iterations: 10000
  save_checkpoint_freq: 1000
  save_checkpoint_dir: null  # 默认写入到 log_dir/checkpoints
  resume_from_checkpoint: null
  eval_freq: 5000
  log_interval: 100
  log_images: false  # 是否保存渲染图像（节省GPU内存）
  log_level: info
  grad_clip_max_norm: 1.0  # 梯度裁剪，null 或 0 表示不裁剪
  use_amp: false  # 混合精度 (AMP)，建议先 false 验证流程
  strict_proxy_grad: false
  strict_proxy_grad_steps: 50
  detect_anomaly_steps: 50
  sentinel:
    enabled: true
    log_every: 20
    alert_on_nan: true
    alert_on_grad_zero: false
    warn_on_proxy_grad_none: false
    max_dense_elements: null  # 不限制；设置整数值可 fail-fast 防 OOM（如 5e9）
  lr_scheduler:
    type: null  # cosine | step | plateau | null
    T_max: 10000  # cosine 用
    eta_min: 1.0e-6  # cosine 用
    # step 用: step_size: 3000, gamma: 0.5
    # plateau 用: mode: max, factor: 0.5, patience: 5
  tensorboard:
    enabled: true
    log_dir: null  # 默认写入 log_dir/tb
    log_every: 20  # 标量写入频率（step）
    log_image_every: 500  # 图片写入频率（step）
    flush_secs: 30
